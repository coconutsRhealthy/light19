  <!-- NB: do NOT preload the brand fonts. The LCP element is hero TEXT with
       font-display:swap, so it paints in the fallback immediately and never waits
       for the web font. Preloading the fonts (highest priority) only starved the
       async stylesheet / render path on mobile — measured LCP 4.8s -> 1.7s once the
       preloads were removed. Fonts load at normal priority and swap in a beat later. -->

  <!-- Shop logos + og:image are served from jsDelivr; warm the connection early
       (DNS+TCP+TLS off the critical path) to help mobile LCP. -->

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DVP906XC65');

  <script>
    function sendCopyCodeToGa(company) {
      if(company === undefined) { company = "unknown"; }
      company = company.split(" (")[0];
      gtag('event', 'CopyCode', {'event_category': 'CopyCode', 'event_label': company});
    }
  </script>

  <script>
    function sendEventToGa(eventName, eventLabel) {
      gtag('event', eventName, {'event_category': eventName, 'event_label': eventLabel});
