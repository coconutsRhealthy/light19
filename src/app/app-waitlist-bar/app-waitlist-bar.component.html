@if (!dismissed) {
  <!-- App-waitlist announcement bar — pinned (with the navbar) via the sticky
       wrapper in navbar.component.html. js-app-waitlist-bar lets the index.html
       guard hide it pre-paint for visitors who already dismissed it. -->
  <div class="js-app-waitlist-bar tw-sticky tw-top-0 lg:tw-static tw-z-40 tw-bg-ink tw-text-cream tw-font-body">
    <!-- Mobile: two rows via flex-wrap + order — [text .. ×] then [form]. Desktop:
         one row, order restored to text | form | ×. -->
    <div class="tw-max-w-7xl tw-mx-auto tw-px-4 sm:tw-px-6 lg:tw-px-8 tw-py-2.5 tw-flex tw-flex-wrap sm:tw-flex-nowrap tw-items-start sm:tw-items-center tw-gap-x-3 tw-gap-y-2.5 sm:tw-gap-5">
      @if (!submitted) {
        <div class="tw-order-1 tw-flex tw-items-center tw-gap-2 tw-min-w-0 tw-flex-1">
          <span aria-hidden="true">✨</span>
          <p class="tw-text-sm tw-leading-tight tw-min-w-0">
            <span class="tw-font-semibold">De Diski-app komt eraan.</span>
            <span class="tw-text-cream/75"> Schrijf je in en maak kans op een </span>
            <span class="tw-font-semibold tw-text-butter">€200 giftcard naar keuze.</span>
          </p>
        </div>
        <form (submit)="submit($event)" class="tw-order-3 sm:tw-order-2 tw-flex tw-items-center tw-gap-2 tw-w-full sm:tw-w-auto">
          <input
            type="email"
            name="appWaitlistEmail"
            [(ngModel)]="email"
            (input)="error = false"
            placeholder="jouw@email.nl"
            aria-label="E-mailadres voor early access tot de Diski-app"
            class="tw-flex-1 sm:tw-w-56 tw-min-w-0 tw-bg-cream tw-text-ink placeholder:tw-text-ink/50 tw-rounded-full tw-px-4 tw-py-2 tw-text-sm tw-outline-none tw-ring-2"
            [class.tw-ring-transparent]="!error"
            [class.tw-ring-butter]="error"
          />
          <button type="submit" class="tw-shrink-0 tw-bg-sky tw-text-ink tw-rounded-full tw-px-4 sm:tw-px-5 tw-py-2 tw-font-semibold tw-text-sm tw-whitespace-nowrap">Ik wil erbij</button>
        </form>
      } @else {
        <p class="tw-text-sm tw-leading-tight tw-flex-1 tw-min-w-0">
          <span class="tw-font-semibold">Je staat op de lijst! 🎉</span>
          <span class="tw-text-cream/75"> Je hoort als eerste zodra de app live gaat.</span>
        </p>
      }
      <button
        type="button"
        (click)="dismiss()"
        aria-label="Melding sluiten"
        class="tw-order-2 sm:tw-order-3 tw-shrink-0 tw-w-7 tw-h-7 tw-rounded-full tw-text-cream/70 hover:tw-text-cream hover:tw-bg-cream/10 tw-flex tw-items-center tw-justify-center tw-transition tw-text-lg tw-leading-none"
      >&times;</button>
    </div>
  </div>
}
