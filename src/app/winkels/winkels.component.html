<div class="tw-min-h-screen tw-bg-pink-50 tw-text-gray-800">
  <app-navbar></app-navbar>

  <main class="tw-max-w-4xl tw-mx-auto tw-px-4 tw-py-12">
    <h1 class="tw-text-3xl sm:tw-text-4xl tw-font-bold tw-mb-10 tw-text-center">
      Alle winkels met actieve kortingscodes
    </h1>

    <!-- Zoekveld -->
    <div class="tw-mb-6 tw-relative">
      <input
              type="text"
              class="tw-w-full tw-px-4 tw-pr-8 tw-py-2 tw-border tw-rounded tw-shadow-sm focus:tw-outline-none focus:tw-ring"
              placeholder="Zoek op webshop..."
              [(ngModel)]="searchTerm"
              (input)="onSearch()"
      />
      @if(searchTerm) {
      <button
              type="button"
              (click)="searchTerm = ''; onSearch()"
              aria-label="Clear"
              class="tw-absolute tw-right-2 tw-top-1/2 tw-transform tw--translate-y-1/2 tw-text-gray-500 hover:tw-text-gray-600 tw-transition tw-rounded-full tw-w-6 tw-h-6 tw-flex tw-items-center tw-justify-center tw-bg-gray-100 hover:tw-bg-gray-200"
      >
        &times;
      </button>
      }
    </div>

    <ul class="tw-space-y-8">
      @for(group of filteredGroupedWinkels; track group.letter) {
        <li>
          <h2 class="tw-text-xl tw-font-semibold tw-text-pink-700 tw-border-b tw-border-pink-200 tw-pb-1 tw-mb-4">
            {{ group.letter }}
          </h2>

          <ul class="tw-grid tw-grid-cols-1 sm:tw-grid-cols-2 md:tw-grid-cols-3 tw-gap-3">
            @for (winkel of group.winkels; track winkel) {
              <li>
                <a
                        [routerLink]="['/' + winkel.toLowerCase() + '/']"
                        class="tw-block tw-p-3 tw-rounded-lg tw-bg-white hover:tw-bg-pink-50 tw-text-pink-900 hover:tw-text-pink-700 tw-shadow-sm hover:tw-shadow-md tw-transition"
                >
                  {{ winkel }}
                </a>
              </li>
            }
          </ul>
        </li>
      }
    </ul>
  </main>

  <app-footer></app-footer>
</div>
