@if (isVisible) {
<!-- Backdrop -->
<div
        class="tw-fixed tw-inset-0 tw-bg-black/40 tw-backdrop-blur-sm tw-z-40 tw-animate-fadeIn"
        (click)="closeModal()"
></div>

<!-- Modal wrapper -->
<div class="tw-fixed tw-inset-0 tw-flex tw-items-center tw-justify-center tw-z-50">

    <div class="tw-bg-white tw-rounded-3xl tw-shadow-2xl tw-border tw-border-gray-100 tw-w-[90%] sm:tw-w-[420px] tw-overflow-hidden tw-animate-slideUp">

        <!-- Header -->
        <div class="tw-flex tw-justify-between tw-items-center tw-px-6 tw-py-4 tw-border-b tw-border-gray-200">
            <h2 class="tw-font-bold tw-text-lg tw-text-gray-900 tw-text-center tw-w-full">
                Shops met nieuwe codes ({{ dateStringLatestShops }})
            </h2>
            <button
                    (click)="closeModal()"
                    class="tw-text-gray-400 hover:tw-text-gray-600 tw-transition"
                    aria-label="Close"
            >
                ✕
            </button>
        </div>

        <!-- Body -->
        <div class="tw-px-6 tw-py-4 tw-max-h-[60vh] tw-overflow-y-auto tw-space-y-2">
            @for (shop of shops; track shop) {
                <a
                        [routerLink]="['/', shop.toLowerCase()]"
                        class="tw-block tw-border-b tw-border-gray-200 tw-py-2 tw-text-blue-600 hover:tw-text-blue-800 hover:tw-underline tw-transition"
                >
                    {{ shop }}
                </a>
            }
            @if (shops.length === 0) {
                <div class="tw-text-gray-500 tw-text-sm tw-text-center tw-py-4">
                    Geen shops gevonden.
                </div>
            }
        </div>

        <!-- Footer -->
        <div class="tw-bg-gray-50 tw-px-6 tw-py-4 tw-flex tw-justify-center tw-border-t tw-border-gray-200">
            <button
                    (click)="closeModal()"
                    class="tw-bg-blue-600 hover:tw-bg-blue-700 tw-text-white tw-font-semibold tw-rounded-xl tw-px-6 tw-py-2 tw-transition"
            >
                Sluiten
            </button>
        </div>

    </div>
</div>
}
