<!-- ====== TOP: announcement bar + navbar ======
     The bar scrolls away with the page; only the navbar pins, and only at lg+
     (via its own `lg:sticky lg:top-0` below).

     There is deliberately NO wrapper element around the bar and the nav. A plain
     div here would become the nav's containing block, and a sticky child can only
     stay pinned while its parent is still in view — the parent would be just
     bar + nav tall, so the navbar would unpin almost immediately. The host is
     `display: contents` for the same reason. -->

<!-- App-waitlist bar taken offline 2026-07-31. Ran 21-30 July and collected 76
     signups (63 of them on the homepage). Re-enable by uncommenting this line:
     the component, its GA event (app_waitlist_signup_<page>) and the Brevo
     app_waitlist path are all still wired up and untouched. -->
<!-- <app-waitlist-bar></app-waitlist-bar> -->

<!-- Only one bar occupies this slot at a time. Two stacked announcement bars
     would push the navbar off a phone screen, so re-enabling either bar means
     retiring the other. -->

<!-- Boodschappen bar taken offline 2026-08-19. Ran 11-18 August from the navbar,
     so it appeared on every page. It drew 41 clicks against 14.665 sessions —
     0,28%, and 0,30% of the 7.673 homepage sessions — which did not justify a
     permanent slot above the navbar on our highest-value page. It was the only
     real traffic source /goedkoopste-supermarkt had (95 sessions, of which ~17
     landed directly and 1 came from search), so that page now runs on its SEO
     alone; the ranking bet is deliberately left to play out on its own.
     Re-enable by uncommenting this line and the import in navbar.component.ts:
     the component and its GA events (boodschappen_bar_click,
     boodschappen_search, boodschappen_product_click) are all still wired up. -->
<!-- <app-boodschappen-bar></app-boodschappen-bar> -->

            <a routerLink="/" class="tw-flex tw-items-center tw-gap-2.5 tw-no-underline"
               onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_logo'})">
                <!-- The favicon SVG *is* the brand mark, so the navbar, the tab icon
                     and the Instagram avatar stay one geometry. Don't re-compose it
                     from a letter + a CSS dot: absolute positioning anchors the dot to
                     the box corner, which puts it below the d's baseline instead of
                     beside it. The rounded corner comes from the SVG's own rx (0.275
                     of the side = 11px at 40px), so no CSS radius is needed. -->
                <img src="/favicon.svg" alt="" width="40" height="40"
                     class="tw-w-10 tw-h-10 tw-shrink-0" />
                <span class="tw-font-title tw-font-bold tw-text-ink tw-text-2xl tw-leading-none tw-tracking-tight">diski<span class="tw-text-dot">.</span></span>
            </a>
