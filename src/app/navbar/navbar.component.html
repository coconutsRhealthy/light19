<!-- ====== STICKY TOP: app-waitlist bar + navbar ======
     Mobile: wrapper is display:contents (generates no box), so the bar + navbar
     behave as direct children of the page (the host is display:contents too).
     The bar's own `sticky top-0` then pins against the FULL-page scroll (not
     this short wrapper), while the navbar stays non-sticky and scrolls away.
     Desktop (lg+): wrapper becomes a real sticky box (lg:block + lg:sticky) that
     pins bar + navbar together as one unit, avoiding a top:0 overlap (the navbar
     is lg:sticky on its own). z-30 matches the navbar's layer so the modal
     backdrop (z-40) still covers it. -->
<div class="tw-contents lg:tw-block lg:tw-sticky lg:tw-top-0 tw-z-30">
<app-waitlist-bar></app-waitlist-bar>

<nav class="lg:tw-sticky lg:tw-top-0 tw-z-30 tw-bg-cream/90 tw-backdrop-blur-md tw-border-b tw-border-ink/10 tw-text-ink tw-font-body">
    <div class="tw-max-w-7xl tw-mx-auto tw-px-4 sm:tw-px-6 lg:tw-px-8">
        <div class="tw-flex tw-justify-between tw-items-center tw-h-16">
            <!-- Brand mark + wordmark -->
            <a routerLink="/" class="tw-flex tw-items-center tw-gap-2.5 tw-no-underline"
               onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_logo'})">
                <!-- The favicon SVG *is* the brand mark, so the navbar, the tab icon
                     and the Instagram avatar stay one geometry. Don't re-compose it
                     from a letter + a CSS dot: absolute positioning anchors the dot to
                     the box corner, which puts it below the d's baseline instead of
                     beside it. The rounded corner comes from the SVG's own rx (0.275
                     of the side = 11px at 40px), so no CSS radius is needed. -->
                <img src="/favicon.svg" alt="" width="40" height="40"
                     class="tw-w-10 tw-h-10 tw-shrink-0" />
                <span class="tw-font-title tw-font-bold tw-text-ink tw-text-2xl tw-leading-none tw-tracking-tight">diski<span class="tw-text-dot">.</span></span>
            </a>

            <!-- Desktop menu -->
            <div class="tw-hidden lg:tw-flex tw-items-center tw-gap-7">
                <a routerLink="/"
                   routerLinkActive="tw-font-semibold tw-opacity-100 tw-border-sky" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-text-ink tw-opacity-70 hover:tw-opacity-100 tw-border-b-2 tw-border-transparent tw-pb-1 tw-transition tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_home'})">
                    Kortingscodes
                </a>
                <a routerLink="/winkels"
                   routerLinkActive="tw-font-semibold tw-opacity-100 tw-border-sky" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-text-ink tw-opacity-70 hover:tw-opacity-100 tw-border-b-2 tw-border-transparent tw-pb-1 tw-transition tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_shops'});">
                    Shops
                </a>
                <a routerLink="/prikbord"
                   routerLinkActive="tw-font-semibold tw-opacity-100 tw-border-sky" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-text-ink tw-opacity-70 hover:tw-opacity-100 tw-border-b-2 tw-border-transparent tw-pb-1 tw-transition tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_prikbord'});">
                    Prikbord
                </a>
                <a routerLink="/blackfriday"
                   routerLinkActive="tw-font-semibold tw-opacity-100 tw-border-sky" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-text-ink tw-opacity-70 hover:tw-opacity-100 tw-border-b-2 tw-border-transparent tw-pb-1 tw-transition tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_blackfriday'});">
                    Beste deals
                </a>
                <a routerLink="/top5"
                   routerLinkActive="tw-font-semibold tw-opacity-100 tw-border-sky" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-text-ink tw-opacity-70 hover:tw-opacity-100 tw-border-b-2 tw-border-transparent tw-pb-1 tw-transition tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_top5'});">
                    Top 5
                </a>
                <a routerLink="/blogs"
                   routerLinkActive="tw-font-semibold tw-opacity-100 tw-border-sky" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-text-ink tw-opacity-70 hover:tw-opacity-100 tw-border-b-2 tw-border-transparent tw-pb-1 tw-transition tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_blogs'});">
                    Blogs
                </a>
                <a routerLink="/contact"
                   routerLinkActive="tw-font-semibold tw-opacity-100 tw-border-sky" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-text-ink tw-opacity-70 hover:tw-opacity-100 tw-border-b-2 tw-border-transparent tw-pb-1 tw-transition tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_contact'});">
                    Contact
                </a>
            </div>

            <!-- Mobile menu knop -->
            <div class="lg:tw-hidden tw-flex tw-items-center">
                <button (click)="toggleMenu()" aria-label="Menu" class="tw-text-ink focus:tw-outline-none">
                    @if (!menuOpen) {
                        <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-6 tw-w-6" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" class="tw-h-6 tw-w-6" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    }
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile menu -->
    @if (menuOpen) {
        <div class="lg:tw-hidden tw-bg-panel tw-border-t tw-border-ink/10 tw-animate-[fadeDown_0.3s_ease-out]">
            <div class="tw-px-4 tw-pt-3 tw-pb-4 tw-space-y-1 tw-font-body">
                <a routerLink="/" (click)="toggleMenu()"
                   routerLinkActive="tw-font-semibold tw-bg-ink/5" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-block tw-text-ink tw-rounded-xl tw-px-4 tw-py-2.5 tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_home'})">
                    Kortingscodes
                </a>
                <a routerLink="/winkels" (click)="toggleMenu()"
                   routerLinkActive="tw-font-semibold tw-bg-ink/5" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-block tw-text-ink tw-rounded-xl tw-px-4 tw-py-2.5 tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_shops'});">
                    Shops
                </a>
                <a routerLink="/prikbord" (click)="toggleMenu()"
                   routerLinkActive="tw-font-semibold tw-bg-ink/5" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-block tw-text-ink tw-rounded-xl tw-px-4 tw-py-2.5 tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_prikbord'});">
                    Prikbord
                </a>
                <a routerLink="/blackfriday" (click)="toggleMenu()"
                   routerLinkActive="tw-font-semibold tw-bg-ink/5" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-block tw-text-ink tw-rounded-xl tw-px-4 tw-py-2.5 tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_blackfriday'});">
                    Beste deals
                </a>
                <a routerLink="/top5" (click)="toggleMenu()"
                   routerLinkActive="tw-font-semibold tw-bg-ink/5" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-block tw-text-ink tw-rounded-xl tw-px-4 tw-py-2.5 tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_top5'});">
                    Top 5
                </a>
                <a routerLink="/blogs" (click)="toggleMenu()"
                   routerLinkActive="tw-font-semibold tw-bg-ink/5" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-block tw-text-ink tw-rounded-xl tw-px-4 tw-py-2.5 tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_blogs'});">
                    Blogs
                </a>
                <a routerLink="/contact" (click)="toggleMenu()"
                   routerLinkActive="tw-font-semibold tw-bg-ink/5" [routerLinkActiveOptions]="{ exact: true }"
                   class="tw-block tw-text-ink tw-rounded-xl tw-px-4 tw-py-2.5 tw-no-underline"
                   onclick="gtag('event', 'navbar', {'event_category': 'Navbar', 'event_label': 'navbar_contact'});">
                    Contact
                </a>
            </div>
        </div>
    }
</nav>
</div><!-- /sticky top -->
