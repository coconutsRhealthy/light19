<app-navbar></app-navbar>
<div class="tw-container tw-mx-auto tw-my-4 tw-px-4">
  <h1 class="tw-text-2xl tw-font-bold tw-my-6 tw-text-center">
    Nieuwe kortingen bij webshops
  </h1>

  <!-- Zoekveld -->
  <div class="tw-mb-2 tw-relative">
    <input
            type="text"
            class="tw-w-full tw-px-4 tw-pr-8 tw-py-2 tw-border tw-rounded tw-shadow-sm focus:tw-outline-none focus:tw-ring"
            placeholder="Zoek op webshop..."
            [(ngModel)]="searchTerm"
            (input)="onSearch()"
    />
    @if(searchTerm) {
    <button
            type="button"
            (click)="searchTerm = ''; onSearch()"
            aria-label="Clear"
            class="tw-absolute tw-right-2 tw-top-1/2 tw-transform tw--translate-y-1/2 tw-text-gray-500 hover:tw-text-gray-600 tw-transition tw-rounded-full tw-w-6 tw-h-6 tw-flex tw-items-center tw-justify-center tw-bg-gray-100 hover:tw-bg-gray-200"
    >
      &times;
    </button>
    }
  </div>

  <div class="tw-grid tw-grid-cols-1 tw-gap-3 lg:tw-gap-4">

    @for (discount of paginatedDiscounts; track discount; let i = $index) {
      <button
              class="tw-w-full tw-bg-white tw-rounded-2xl tw-shadow-md hover:tw-shadow-lg active:tw-scale-[0.98]
                     tw-transition-all tw-duration-200 tw-p-3 lg:tw-p-4 tw-flex tw-justify-between tw-items-center
                     tw-border tw-border-gray-100 tw-text-left tw-h-full"
      >
        <div class="tw-flex-1 tw-pr-3">
          <h3 class="tw-text-base lg:tw-text-lg tw-font-semibold tw-text-gray-900 tw-truncate lg:tw-max-w-[180px]">
            {{ discount.webshop_name }}
          </h3>

          <p class="tw-text-sm tw-text-gray-600 tw-mt-1">
            {{ discount.korting_text_nl || discount.korting_text }}
          </p>
          <p class="tw-text-xs tw-text-gray-400 tw-mt-1">
            Gespot op: {{ formatDate(discount.date) }}
          </p>
        </div>

        @if (getLogoUrl(discount.webshop_name)) {
          <div class="tw-flex-shrink-0">
            <img
                    [src]="getLogoUrl(discount.webshop_name)"
                    [alt]="discount.webshop_name + ' logo'"
                    class="tw-w-16 tw-h-16 lg:tw-w-14 lg:tw-h-14 tw-rounded-md tw-object-contain tw-bg-gray-50 tw-border tw-border-gray-100"
            />
          </div>
        }
      </button>
    }
  </div>

</div>
<app-footer></app-footer>
